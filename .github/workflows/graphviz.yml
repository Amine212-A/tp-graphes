name: graphes
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Installation de graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Lancement graphviz
        run: |
          chmod +x ./run1.sh
          ./run1.sh g1

